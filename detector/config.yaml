# HNG Anomaly Detection System — Configuration

log:
  file: /var/lib/docker/volumes/HNG-nginx-logs/_data/hng-access.log
  audit: /opt/hng-detector/logs/audit.log

sliding_window:
  seconds: 60
  global_seconds: 60

baseline:
  window_minutes: 30
  recalc_interval: 60

detection:
  zscore_threshold: 3.0
  rate_multiplier: 5.0
  error_rate_multiplier: 3.0

blocking:
  check_interval: 10
  unban_schedule:
    - 600     # 10 minutes
    - 1800    # 30 minutes
    - 7200    # 2 hours
    - -1      # permanent

slack:
  enabled: false
  webhook_url: ""

dashboard:
  port: 5000
  refresh_seconds: 3
